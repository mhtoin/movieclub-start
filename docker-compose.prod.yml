# docker-compose.prod.yml

services:
  postgres:
    image: postgres:16-alpine
    container_name: movieclub-postgres-prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
    shm_size: 128mb
    env_file:
      - ${MOVIECLUB_ENV_FILE:-.env.production}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-movieclub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-movieclub}
    command:
      [
        'postgres',
        '-c',
        'wal_level=logical',
        '-c',
        'shared_buffers=64MB',
        '-c',
        'max_connections=20',
        '-c',
        'work_mem=4MB',
        '-c',
        'client_connection_check_interval=30s',
      ]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-movieclub} -d ${POSTGRES_DB:-movieclub}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - movieclub-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_TMDB_API_KEY: ${VITE_TMDB_API_KEY}
        VITE_TMDB_BASE_URL: ${VITE_TMDB_BASE_URL:-https://api.themoviedb.org/3}
        VITE_TMDB_IMAGE_BASE_URL: ${VITE_TMDB_IMAGE_BASE_URL:-https://image.tmdb.org/t/p}
        VITE_SHORTLIST_CARD_VARIANT: ${VITE_SHORTLIST_CARD_VARIANT}
    container_name: movieclub-app-prod
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    env_file:
      - ${MOVIECLUB_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-movieclub}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-movieclub}?sslmode=disable
      SESSION_PASSWORD: ${SESSION_PASSWORD:?Session password required}
      BASE_URL: ${BASE_URL:?BASE_URL required}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY required}
      EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM required}
      VITE_TMDB_API_KEY: ${VITE_TMDB_API_KEY:?TMDB API key required}
      VITE_TMDB_BASE_URL: ${VITE_TMDB_BASE_URL:-https://api.themoviedb.org/3}
      VITE_TMDB_IMAGE_BASE_URL: ${VITE_TMDB_IMAGE_BASE_URL:-https://image.tmdb.org/t/p}
      VITE_SHORTLIST_CARD_VARIANT: ${VITE_SHORTLIST_CARD_VARIANT}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - movieclub-network
    # Expose app on port 3001 for Nginx Proxy Manager to proxy
    ports:
      - '3001:3001'

networks:
  movieclub-network:
    driver: bridge

volumes:
  postgres_data:
