name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check:
    name: Lint & Lockfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting & lint
        run: pnpm run check:ci

      - name: Type check
        run: pnpm run typecheck

  deploy:
    name: Deploy to Mac mini
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, movieclub-production]
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Production env file lives outside the repo at ~/.config/movieclub/.env.production
          # (referenced by MOVIECLUB_ENV_FILE below). Don't clean untracked files.
          clean: false
          persist-credentials: false

      # Diagnose the runner's Docker context. OrbStack's daemon socket and
      # wrapper require env vars (PATH, ORBSTACK_HOME, ...) that the runner's
      # LaunchDaemon worker may not inherit. If `docker info` fails, the
      # deploy will fail anyway — fail fast with a useful message.
      - name: Verify Docker context
        run: |
          echo "User: $(whoami)"
          echo "HOME: $HOME"
          echo "PATH: $PATH"
          echo "--- docker context ls ---"
          docker context ls
          echo "--- docker info (first 20 lines, 15s timeout) ---"
          timeout 15 docker info | head -20 || {
            echo "::error::Docker daemon unreachable from runner context. Check OrbStack is running and the runner service has access to ~/.orbstack and ~/.docker."
            exit 1
          }

      - name: Deploy production stack
        env:
          DEPLOY_PULL: '0'
        run: MOVIECLUB_ENV_FILE="$HOME/.config/movieclub/.env.production" bash scripts/deploy.sh --skip-pull

      - name: Smoke test (public URL)
        run: |
          sleep 5
          curl -fsS --retry 5 --retry-delay 5 https://beta.leffaseura.club/api/health

      - name: Notify Discord (failure)
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: 'Deploy failed'
          description: |
            Branch: `${{ github.ref }}`
            Commit: `${{ github.sha }}`
            Author: ${{ github.actor }}
          color: 0xff0000
          url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
